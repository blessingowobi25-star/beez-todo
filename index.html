<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BeezTodo - a fast to-do list app with notes, due dates, priorities, a focus timer and progress stats."
    />
    <meta name="theme-color" content="#6d5ef0" />
    <title>TaskFlow · To-Do List + Notes</title>
    <script>
      // Apply the persisted theme before first paint so the page never flashes the wrong colours.
      (function () {
        var fallback = 'light';
        try {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          fallback = prefersDark ? 'dark' : 'light';
          var raw = localStorage.getItem('beeztodo:prefs') || localStorage.getItem('taskflow:prefs');
          var parsed = raw ? JSON.parse(raw) : null;
          var saved = parsed && parsed.theme;
          document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : fallback;
        } catch (err) {
          document.documentElement.dataset.theme = fallback;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
